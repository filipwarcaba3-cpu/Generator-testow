<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuizLab — Logowanie</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@600;800&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f8f5;color:#172c28;font:15px 'DM Sans',sans-serif;display:grid;place-items:center}.box{width:min(420px,calc(100% - 32px));background:white;border:1px solid #e5ebe6;border-radius:18px;padding:32px;box-shadow:0 15px 45px #193b2810}.brand{font:800 22px Manrope;margin-bottom:34px}.brand span{background:#176b50;color:white;padding:7px 10px;border-radius:10px;margin-right:9px}.eyebrow{color:#176b50;text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:11px}h1{font:800 27px Manrope;margin:8px 0}p{color:#72807b}.flash{background:#fff0ed;color:#9a3e31;padding:10px;border-radius:8px;font-size:13px;margin:12px 0}label{display:block;font-weight:700;font-size:13px;margin:18px 0 7px}input{width:100%;padding:12px;border:1px solid #dce5de;border-radius:9px;font:inherit}button{width:100%;margin-top:22px;border:0;background:#176b50;color:white;padding:13px;border-radius:9px;font:700 15px 'DM Sans';cursor:pointer}.hint{font-size:12px;background:#eef6ef;padding:11px;border-radius:9px;color:#456754;margin-top:16px}</style></head><body><main class="box"><div class="brand"><span>✳</span>quizlab</div><div class="eyebrow">Twoja przestrzeń do nauki</div><h1>Zaloguj się</h1><p>Wpisz login i hasło otrzymane od administratora.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash">{{ message }}</div>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="login">Login</label><input id="login" name="login" autocomplete="username" required><label for="password">Hasło</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Zaloguj się</button></form><div class="hint"><b>Konto początkowe administratora</b><br>Login: admin &nbsp;·&nbsp; Hasło: 1234</div></main></body></html>
